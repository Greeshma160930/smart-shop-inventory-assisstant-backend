# Server Configuration
server.port=8080

# Spring Application
spring.application.name=smart-shop-inventory-assistant

# MySQL Database Configuration (Aiven Cloud MySQL)
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql-2841828f-anurag-4146.b.aivencloud.com}:${DB_PORT:20826}/${DB_NAME:defaultdb}?sslMode=REQUIRED
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Security Configuration
smartshop.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
smartshop.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Scheduled Forecast Configuration (Default: Every day at 2:00 AM)
smartshop.forecast.cron=${FORECAST_CRON:0 0 2 * * ?}

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
